[project]
name = "qik-synthetic"
version = "0.1.0"
description = "Synthetic data utilities for the Quant Infrastructure Kit."
readme = "README.md"
authors = [
    { name = "Alex Lapchenko", email = "ozeron@me.com" }
]
requires-python = ">=3.14"
dependencies = ["numpy>=2.0", "pandas>=2.2"]

[project.optional-dependencies]
models = ["statsmodels", "arch"]

[project.scripts]
qik-synthetic = "qik.synthetic.cli:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "qik.synthetic"
